[project]
name = "autonomous-polaris-agent"
version = "0.1.0"
description = "Autonomous agent for Polaris chemistry benchmarks: plans and runs ML pipelines from natural language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "rich>=13.0.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "polaris-lib>=0.1.0",
    "scikit-learn>=1.5.0",
    "rdkit>=2024.0",
    "matplotlib>=3.9.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
autonomous-polaris-agent = "autonomous_polaris_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_polaris_agent"]
