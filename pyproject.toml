[project]
name = "autonomous-polaris-agent"
version = "0.1.0"
description = "Autonomous agent for Polaris chemistry benchmarks: plans and runs ML pipelines from natural language."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "opensandbox>=0.1.5",
    "opensandbox-server>=0.1.6",
    "polaris-lib>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
autonomous-polaris-agent = "autonomous_polaris_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_polaris_agent"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (network/benchmark fetch)"]
